<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>QuickNotes Manager</h1>

    <!-- Control Section -->
    <section class="controls">
      <button id="load-btn">Load notes</button>
      <p id="status" class="status-message"></p>
    </section>

    <!-- Create Note Form -->
    <section class="form-section">
      <h2>Create New Note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Title (required, max 100 chars):</label>
          <input type="text" id="title-input" maxlength="100" required placeholder="Enter note title...">
        </div>
        <div class="form-group">
          <label for="body-input">Body (optional):</label>
          <textarea id="body-input" placeholder="Enter note body..."></textarea>
        </div>
        <button type="submit" id="submit-btn">Create Note</button>
      </form>
    </section>

    <!-- Notes List Section -->
    <section class="list-section">
      <h2>Notes Feed</h2>
      <ul id="notes-list">
        <li class="empty-state">No notes loaded yet. Click "Load notes" to start.</li>
      </ul>
    </section>
  </main>
</body>
</html>
